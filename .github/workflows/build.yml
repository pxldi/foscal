name: build

on:
  push:
    branches: [main]
  pull_request:
  # So a release build can still be produced on demand from a branch without pushing to main.
  workflow_dispatch:

# The runner is a single machine with finite RAM, so an older run of the same branch is not worth
# keeping alive: it is building a commit nobody is going to look at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the code: artifacts and the cache use the runner's own token, not this one.
# A public repo runs this workflow for forks' pull requests too, so it gets no more than that.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Pull requests verify the debug variant only. The release build is a full second compilation
      # of every module plus R8, and it can only fail in ways the debug build and lint do not for
      # signing or shrinking reasons — neither of which a code review is checking. It still runs on
      # main, on tags, and on demand, so a broken release build is caught before it ships.
      FULL_BUILD: ${{ github.event_name != 'pull_request' }}
      # One Gradle invocation and a smaller heap than the local default. The runner shares its RAM
      # with everything else on the machine, and four separate --no-daemon invocations each paid for
      # their own JVM, configuration phase and Kotlin daemon.
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode release keystore
        if: env.FULL_BUILD == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CALENDARIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FOSCAL_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      # Assemble, lint and test in a single invocation: Gradle configures the build once, keeps one
      # Kotlin compile daemon, and can overlap independent tasks. --max-workers caps how many of
      # those run at a time, which is the knob that actually decides peak memory.
      - name: Build, lint and test
        run: |
          TASKS=":app:assembleDebug :app:lintDebug testDebugUnitTest :core:core-model:test"
          if [ "$FULL_BUILD" = "true" ]; then
            TASKS="$TASKS :app:assembleRelease"
          fi
          ./gradlew $TASKS --no-daemon --max-workers=2
        env:
          FOSCAL_STORE_PASSWORD: ${{ secrets.CALENDARIUM_STORE_PASSWORD }}
          FOSCAL_KEY_ALIAS: ${{ secrets.CALENDARIUM_KEY_ALIAS }}
          FOSCAL_KEY_PASSWORD: ${{ secrets.CALENDARIUM_KEY_PASSWORD }}

      # Uploaded only where someone might install it. A debug APK per pull-request push is a build
      # artifact nobody downloads and storage that has to be paid for either way.
      - name: Upload debug APK
        if: env.FULL_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foscal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.FULL_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foscal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Test reports are the one artifact worth having on a failed pull-request run: without them
      # the only record of which assertion failed is the scrollback of a log that expires.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # Release notes are generated from commit subjects (cliff.toml), and a subject that is not a
  # Conventional Commit drops out of them without a trace. Merge commits are GitHub's own.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects follow Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=$(git log --no-merges --format='%h %s' "$BASE..$HEAD" | grep -Ev "^[0-9a-f]+ ($pattern|Revert \")" || true)
          if [ -n "$bad" ]; then
            echo "::error::Commit subjects must follow Conventional Commits (see AGENTS.md):"
            echo "$bad"
            exit 1
          fi
