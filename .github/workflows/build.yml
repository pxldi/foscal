name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CALENDARIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FOSCAL_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          FOSCAL_STORE_PASSWORD: ${{ secrets.CALENDARIUM_STORE_PASSWORD }}
          FOSCAL_KEY_ALIAS: ${{ secrets.CALENDARIUM_KEY_ALIAS }}
          FOSCAL_KEY_PASSWORD: ${{ secrets.CALENDARIUM_KEY_PASSWORD }}

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calendarium-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: calendarium-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
