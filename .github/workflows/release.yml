name: release

on:
  push:
    tags:
      - 'v*'
  # A tag push is silently ignored when the tagged commit's message contains a
  # skip directive such as [skip ci] — GitHub evaluates it per commit, not per
  # ref, so the tag inherits the skip from whatever it points at and no release
  # is ever built. Dispatching by hand is the way back out without having to
  # move the tag onto a different commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One name for the tag whichever way the job started: the ref that was
    # pushed, or the tag typed into the dispatch form.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CALENDARIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FOSCAL_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          FOSCAL_STORE_PASSWORD: ${{ secrets.CALENDARIUM_STORE_PASSWORD }}
          FOSCAL_KEY_ALIAS: ${{ secrets.CALENDARIUM_KEY_ALIAS }}
          FOSCAL_KEY_PASSWORD: ${{ secrets.CALENDARIUM_KEY_PASSWORD }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --generate-notes \
            --title "$TAG" \
            app/build/outputs/apk/release/*.apk
